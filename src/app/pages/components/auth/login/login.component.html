<ion-content class="login-page" fullscreen>
  <div class="login-wrapper">
    <div class="login-container">
      <h1>Bem-vindo</h1>
      <p class="subtitle">Faça login para continuar</p>

      <ion-item class="input-item">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input type="email" placeholder="E-mail" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item class="input-item">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input type="password" placeholder="Senha" [(ngModel)]="password"></ion-input>
      </ion-item>

      <ion-button expand="block" (click)="login()" class="login-btn">
        Entrar
      </ion-button>

      <p class="register-link">
        Não tem conta? <a routerLink="/signup">Cadastre-se</a>
      </p>
    </div>
  </div>
</ion-content>
